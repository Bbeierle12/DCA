<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DCA City 3D</title>

        body {
            margin: 0;
            background-color: #202020;
            font-family: 'VT323', monospace;
            overflow: hidden;
            touch-action: none;
            user-select: none;
        }
        /* Custom scrollbar for settings */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #2c3e50; }
        ::-webkit-scrollbar-thumb { background: #95a5a6; border-radius: 4px; }
        
        .pixel-font { font-family: 'VT323', monospace; }
        .hand-font { font-family: 'Patrick Hand', cursive; }
        
        .floating-text {
            animation: floatUp 1s ease-out forwards;
        }
        @keyframes floatUp { 
            0% { transform: translateY(0); opacity: 1; } 
            100% { transform: translateY(-50px); opacity: 0; } 
        }
    </style>
</head>
